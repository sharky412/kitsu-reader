name: Instrumentation tests

# Emulator jobs are slow and occasionally flaky, so they are kept out of the pull-request path.
# They run nightly and on demand, and they guard the constraints that unit tests cannot reach:
# the Room migration chain, dynamic shortcuts and the backup/restore round trip.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected:
    name: Connected tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        # 23 is minSdk, 34 is a current runtime. Both paths differ substantially in this app
        # (storage permissions, notifications, foreground service types).
        api-level: [ 23, 34 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-report-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected
          if-no-files-found: ignore
